<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enterprise Data Architecture Patterns</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.0/dist/mermaid.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sidebar-width: 280px;
      --header-height: 52px;
      --bg: #0f1117;
      --sidebar-bg: #161b22;
      --border: #30363d;
      --accent: #58a6ff;
      --accent-hover: #79c0ff;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --hover-bg: #1c2128;
      --active-bg: #1f3a5f;
      --code-bg: #161b22;
      --table-alt: #161b22;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      height: var(--header-height);
      background: var(--sidebar-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 12px;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header h1 {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
    }

    header .tag {
      font-size: 11px;
      background: #1f3a5f;
      color: var(--accent);
      border: 1px solid #2d5a9e;
      border-radius: 12px;
      padding: 2px 8px;
    }

    #menu-toggle {
      display: none;
      background: none;
      border: none;
      color: var(--text);
      cursor: pointer;
      padding: 4px;
      margin-left: auto;
    }

    /* ── Layout ── */
    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    aside {
      width: var(--sidebar-width);
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      flex-shrink: 0;
      padding: 12px 0;
    }

    aside::-webkit-scrollbar { width: 4px; }
    aside::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .nav-home {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 16px;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 13px;
      border-radius: 4px;
      margin: 0 8px 8px;
      transition: background 0.15s;
    }
    .nav-home:hover, .nav-home.active { background: var(--hover-bg); color: var(--text); }
    .nav-home.active { color: var(--accent); }

    .nav-section { margin-bottom: 4px; }

    .nav-section-header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
      transition: color 0.15s;
    }
    .nav-section-header:hover { color: var(--text); }

    .nav-section-header .chevron {
      margin-left: auto;
      transition: transform 0.2s;
      font-size: 10px;
    }
    .nav-section-header.open .chevron { transform: rotate(90deg); }

    .nav-items { display: none; }
    .nav-items.open { display: block; }

    .nav-group-label {
      padding: 4px 16px 2px 28px;
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
      margin-top: 4px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 16px 5px 36px;
      font-size: 12.5px;
      color: var(--text-muted);
      cursor: pointer;
      border-left: 2px solid transparent;
      transition: background 0.12s, color 0.12s;
      line-height: 1.4;
    }
    .nav-item:hover { background: var(--hover-bg); color: var(--text); }
    .nav-item.active {
      background: var(--active-bg);
      color: var(--accent);
      border-left-color: var(--accent);
    }

    .badge {
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 10px;
      background: var(--hover-bg);
      color: var(--text-muted);
      margin-left: auto;
      flex-shrink: 0;
    }
    .badge.managed { background: #0d3b1e; color: #3fb950; }
    .badge.oss { background: #1c2a3a; color: #58a6ff; }
    .badge.hybrid { background: #2d1f3d; color: #bc8cff; }

    /* ── Content ── */
    main {
      flex: 1;
      min-width: 0;
      overflow-y: auto;
      padding: 32px 24px 40px 16px;
    }

    main::-webkit-scrollbar { width: 6px; }
    main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    #content { overflow-x: hidden; }
    #content h1 { font-size: 28px; font-weight: 700; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    #content h2 { font-size: 20px; font-weight: 600; margin: 32px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
    #content h3 { font-size: 16px; font-weight: 600; margin: 24px 0 10px; }
    #content h4 { font-size: 14px; font-weight: 600; margin: 20px 0 8px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }
    #content p { line-height: 1.7; margin-bottom: 14px; font-size: 14px; }
    #content ul, #content ol { padding-left: 20px; margin-bottom: 14px; }
    #content li { line-height: 1.7; font-size: 14px; margin-bottom: 3px; }
    #content li ul { margin-top: 4px; margin-bottom: 4px; }
    #content a { color: var(--accent); text-decoration: none; }
    #content a:hover { color: var(--accent-hover); text-decoration: underline; }
    #content strong { color: var(--text); }
    #content blockquote { border-left: 3px solid var(--border); padding: 8px 16px; color: var(--text-muted); margin: 16px 0; font-style: italic; }
    #content hr { border: none; border-top: 1px solid var(--border); margin: 28px 0; }
    #content code { background: var(--code-bg); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; font-size: 12.5px; font-family: "SF Mono", Consolas, monospace; color: #f78166; }
    #content pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; padding: 16px; overflow-x: auto; margin: 16px 0; white-space: pre; max-width: 100%; }
    #content pre code { background: none; border: none; padding: 0; color: var(--text); font-size: 12.5px; font-family: "SF Mono", "Cascadia Code", Consolas, monospace; white-space: pre; line-height: 1.5; }

    #content table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 13px; }
    #content th { background: var(--sidebar-bg); color: var(--text-muted); font-weight: 600; text-align: left; padding: 10px 12px; border: 1px solid var(--border); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
    #content td { padding: 9px 12px; border: 1px solid var(--border); vertical-align: top; line-height: 1.5; }
    #content tr:nth-child(even) td { background: var(--table-alt); }

    .loading { color: var(--text-muted); font-size: 14px; padding: 40px 0; }
    .error { color: #f85149; font-size: 14px; padding: 40px 0; }

    /* ── Mobile ── */
    @media (max-width: 700px) {
      #menu-toggle { display: block; }
      aside { position: fixed; top: var(--header-height); left: 0; bottom: 0; z-index: 90; transform: translateX(-100%); transition: transform 0.25s; }
      aside.open { transform: translateX(0); }
      main { padding: 24px 20px; }
    }
  </style>
</head>

async function renderMermaid(container) {
  const blocks = container.querySelectorAll('code.language-mermaid');
  for (const block of blocks) {
    const code = block.textContent;
    const wrapper = document.createElement('div');
    wrapper.style.cssText = 'overflow-x:auto;margin:16px 0;';
    const el = document.createElement('div');
    el.className = 'mermaid-diagram';
    el.style.cssText = 'background:#161b22;border:1px solid #30363d;border-radius:8px;padding:20px;min-width:fit-content;';
    try {
      const id = 'mermaid-' + Math.random().toString(36).slice(2);
      const { svg } = await mermaid.render(id, code);
      el.innerHTML = svg;
    } catch (e) {
      el.innerHTML = `<pre style="color:#f85149;font-size:12px">${e.message}</pre>`;
    }
    wrapper.appendChild(el);
    block.parentElement.replaceWith(wrapper);
  }
}

// Build sidebar
const tree = document.getElementById('nav-tree');
NAV.forEach(section => {
  const sec = document.createElement('div');
  sec.className = 'nav-section';

  const hdr = document.createElement('div');
  hdr.className = 'nav-section-header';
  hdr.innerHTML = `<span>${section.label}</span><span class="chevron">▶</span>`;
  hdr.onclick = () => {
    hdr.classList.toggle('open');
    items.classList.toggle('open');
  };

  const items = document.createElement('div');
  items.className = 'nav-items';

  section.groups.forEach(group => {
    const gl = document.createElement('div');
    gl.className = 'nav-group-label';
    gl.textContent = group.label;
    items.appendChild(gl);

    group.items.forEach(item => {
      const el = document.createElement('div');
      el.className = 'nav-item';
      el.dataset.id = item.id;
      el.dataset.path = item.path;
      el.innerHTML = `<span>${item.label}</span><span class="badge ${item.badge}">${item.badge}</span>`;
      el.onclick = () => loadDoc(item.id, item.path, section.id, el);
      items.appendChild(el);
    });
  });

  sec.appendChild(hdr);
  sec.appendChild(items);
  tree.appendChild(sec);
});

// State
let currentSection = null;

function setActiveNav(el) {
  document.querySelectorAll('.nav-item').forEach(e => e.classList.remove('active'));
  document.getElementById('nav-home').classList.remove('active');
  if (el) el.classList.add('active');
}

function openSection(sectionId) {
  if (currentSection === sectionId) return;
  currentSection = sectionId;
  document.querySelectorAll('.nav-section-header').forEach((hdr, i) => {
    const items = hdr.nextElementSibling;
    if (NAV[i].id === sectionId) {
      hdr.classList.add('open');
      items.classList.add('open');
    }
  });
}

async function loadDoc(id, path, sectionId, navEl) {
  location.hash = id;
  setActiveNav(navEl);
  openSection(sectionId);
  closeMobileMenu();

  const content = document.getElementById('content');
  content.innerHTML = '<p class="loading">Loading…</p>';

  try {
    const res = await fetch(`${BASE}/${path}`);
    if (!res.ok) throw new Error(res.status);
    const md = await res.text();
    // Strip front matter
    const stripped = md.replace(/^---[\s\S]*?---\n/, '');
    content.innerHTML = marked.parse(stripped);
    renderMermaid(content);
    content.scrollTop = 0;
    window.scrollTo(0, 0);
    document.querySelector('main').scrollTo(0, 0);
  } catch (e) {
    content.innerHTML = `<p class="error">Could not load document (${e.message})</p>`;
  }
}

async function loadHome() {
  location.hash = '';
  setActiveNav(null);
  document.getElementById('nav-home').classList.add('active');
  closeMobileMenu();

  const content = document.getElementById('content');
  content.innerHTML = '<p class="loading">Loading…</p>';

  try {
    const res = await fetch(`${BASE}/index.md`);
    if (!res.ok) throw new Error(res.status);
    const md = await res.text();
    const stripped = md.replace(/^---[\s\S]*?---\n/, '');
    content.innerHTML = marked.parse(stripped);
    renderMermaid(content);
    document.querySelector('main').scrollTo(0, 0);
  } catch (e) {
    content.innerHTML = `<p class="error">Could not load index (${e.message})</p>`;
  }
}

function toggleMenu() {
  document.getElementById('sidebar').classList.toggle('open');
}
function closeMobileMenu() {
  document.getElementById('sidebar').classList.remove('open');
}

// Hash routing on load
function routeFromHash() {
  const hash = location.hash.slice(1);
  if (!hash) { loadHome(); return; }

  for (const section of NAV) {
    for (const group of section.groups) {
      for (const item of group.items) {
        if (item.id === hash) {
          const el = document.querySelector(`.nav-item[data-id="${item.id}"]`);
          loadDoc(item.id, item.path, section.id, el);
          return;
        }
      }
    }
  }
  loadHome();
}

window.addEventListener('hashchange', routeFromHash);
routeFromHash();
</script>
